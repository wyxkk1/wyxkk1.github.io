<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
.banner{
  width:100%;
  position:relative;
  display:flex;
  align-items:center;
}
.banner>img{width:100%;display:block;}
.prev{position:absolute;left:30px;z-index:2;}
.next{position:absolute;right:30px;z-index:2;}
.dots{
  display:flex;
  gap:5px;
  position:absolute;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
}
.dots img{width:18px;height:18px;}
</style>
</head>
<body>
<div class="banner">
  <a href=" " class="prev"><img src="images/arrow1.png"></a >
  <img src="images/banner1.jpg">
  <a href="#" class="next"><img src="images/arrow2.png"></a >
  <div class="dots">
    <img src="images/point1.png">
    <img src="images/point2.png">
    <img src="images/point1.png">
    <img src="images/point1.png">
  </div>
</div>
</body>
</html>
