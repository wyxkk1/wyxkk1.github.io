<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>网上书城-注册新用户</title>
    <!-- 字体图标在线引入 -->
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #eee;
            font-family: "微软雅黑";
        }
        /* 外层容器 */
        .box {
            width: 420px;
            margin: 50px auto;
            border: 1px solid #888;
            background: #e0e0e0;
        }
        /* 顶部标题栏 */
        .header {
            height: 40px;
            line-height: 40px;
            text-align: center;
            background: #777;
            color: #fff;
            font-size: 18px;
        }
        /* 带加号小标题 */
        .subhead {
            height: 32px;
            line-height: 32px;
            padding-left: 10px;
            background: #ddd;
            border-bottom: 1px solid #999;
        }
        /* 表单表格 */
        table {
            margin: 20px auto;
        }
        td {
            padding: 6px 4px;
        }
        /* 输入框外层，用来放图标 */
        .input-wrap {
            position: relative;
        }
        /* 输入框内图标样式 */
        .input-wrap i {
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            color: #555;
            font-size: 14px;
        }
        /* 输入框，左边留出图标位置 */
        .input-box {
            width: 180px;
            height: 24px;
            border: 1px solid #999;
            padding-left: 28px;
        }
        /* 提交按钮 */
        .submit {
            width: 180px;
            height: 26px;
            background: #666;
            color: #fff;
            border: none;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="header">网上书城</div>
        <div class="subhead">➕ 注册新用户</div>

        <form>
            <table>
                <tr>
                    <td>
                        <div class="input-wrap">
                            <i class="fas fa-user"></i>
                            <input type="text" class="input-box" placeholder="用户名">
                        </div>
                    </td>
                </tr>
                <tr>
                    <td>
                        <div class="input-wrap">
                            <i class="fas fa-lock"></i>
                            <input type="password" class="input-box" placeholder="密码">
                        </div>
                    </td>
                </tr>
                <tr>
                    <td>
                        <div class="input-wrap">
                            <i class="fas fa-key"></i>
                            <input type="password" class="input-box" placeholder="确认密码">
                        </div>
                    </td>
                </tr>
                <tr>
                    <td>
                        <div class="input-wrap">
                            <i class="fas fa-envelope"></i>
                            <input type="email" class="input-box" placeholder="电子邮箱">
                        </div>
                    </td>
                </tr>
                <tr>
                    <td>
                        <input type="submit" value="注册新用户" class="submit">
                    </td>
                </tr>
            </table>
        </form>
    </div>
</body>
</html>
